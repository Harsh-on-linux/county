<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body
    style="
      margin: 0;
      background: #f1efe9;
      color: #252820;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f1efe9"
    >
      <tr>
        <td align="center" style="padding: 48px 24px">
          <table
            role="presentation"
            width="440"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 440px; width: 100%"
          >
            <tr>
              <td
                style="
                  padding-bottom: 40px;
                  font:
                    700 35px Georgia,
                    serif;
                  letter-spacing: -1.5px;
                "
              >
                county<span style="color: #ef7845">.</span>
              </td>
            </tr>
            <tr>
              <td
                style="
                  font:
                    700 30px/1.2 Georgia,
                    serif;
                  letter-spacing: -0.8px;
                "
              >
                Your sign-in code.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 16px;
                  font-size: 14px;
                  line-height: 1.8;
                  color: #6d7068;
                "
              >
                Enter this code in County to connect your personal space. Your
                code can only be used once.
              </td>
            </tr>
            <tr>
              <td style="padding: 30px 0">
                <div
                  style="
                    padding: 24px 12px;
                    border: 1px solid #d7d6cf;
                    border-radius: 16px;
                    text-align: center;
                    font:
                      600 30px/1.4 Arial,
                      Helvetica,
                      sans-serif;
                    letter-spacing: 6px;
                    color: #252820;
                  "
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="font-size: 12px; line-height: 1.8; color: #6d7068">
                If you did not request this code, you can ignore this email. Do
                not share the code with anyone.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 36px;
                  font-size: 11px;
                  line-height: 1.8;
                  color: #81847c;
                "
              >
                Your money. A little clearer.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
