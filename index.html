<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#d8d6c9" />
    <script>
      try {
        const appearance = localStorage.getItem("county-appearance");
        document.documentElement.dataset.theme =
          appearance === "dark" ||
          (appearance !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {}
    </script>
    <style>
      .county-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d8d6c9;
        color: #e65416;
      }
      [data-theme="dark"] .county-boot {
        background: #303236;
        color: #e65416;
      }
    </style>
    <meta
      name="description"
      content="Your money. A little clearer. County is your family's offline money companion."
    />
    <title>County · Your money, a little clearer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/manila-black.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root">
      <div class="county-boot" role="status" aria-label="Opening County"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
